<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d27">
<title>Kurozi Lucky Spin</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0%,#47317c 0,#191333 42%,#0b0918 100%);display:grid;place-items:center;padding:24px}
.wrap{width:min(100%,520px);text-align:center}.tag{display:inline-block;padding:7px 13px;border:1px solid #ffffff25;border-radius:30px;color:#d8c9ff;font-size:12px;letter-spacing:2px}.title{font-size:clamp(30px,8vw,46px);font-weight:900;letter-spacing:-1.5px;margin:16px 0 6px}.sub{color:#c4bdd8;margin:0 0 25px}
.stage{position:relative;width:min(84vw,370px);aspect-ratio:1;margin:0 auto 24px;filter:drop-shadow(0 18px 35px #0008)}canvas{width:100%;height:100%;display:block;transition:transform 5s cubic-bezier(.12,.72,.08,1);border-radius:50%}.pointer{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:36px solid #fff;filter:drop-shadow(0 3px 5px #0008)}
button{border:0;border-radius:15px;padding:16px 28px;background:linear-gradient(100deg,#a78bfa,#ec4899);color:white;font-size:16px;font-weight:900;letter-spacing:.5px;cursor:pointer;box-shadow:0 9px 30px #9b5cff44}button:disabled{opacity:.6;cursor:wait}.hint{font-size:12px;color:#a9a0bd;margin:18px 0 0}.result{display:none;margin:22px auto 0;padding:22px;border:1px solid #ffffff24;border-radius:20px;background:#ffffff0d;backdrop-filter:blur(12px)}.result.show{display:block;animation:pop .35s ease}.result small{color:#c4b5fd;letter-spacing:2px}.prize{font-size:27px;font-weight:900;margin:9px 0 16px;color:#f5d0fe}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}.foot{margin-top:28px;color:#817894;font-size:11px;line-height:1.6}
</style></head>
<body><main class="wrap">
<div class="tag">KUROZI • SPECIAL GIVEAWAY</div>
<h1 class="title">PUTAR & MENANG</h1><p class="sub">Satu putaran, satu hadiah kejutan. Semoga beruntung!</p>
<div class="stage"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas></div>
<button id="spin">PUTAR SEKARANG ✦</button>
<div class="result" id="result"><small>SELAMAT! HADIAH KAMU</small><div class="prize" id="prize"></div><button id="again">PUTAR LAGI</button></div>
<p class="hint">Hadiah ditentukan secara acak. Hasil spin merupakan klaim hadiah yang perlu dikonfirmasi kepada penyelenggara.</p>
<div class="foot">© KUROZI • GOOD LUCK!<br>Hadiah mengikuti ketersediaan penyelenggara.</div>
</main>
<script>
const prizes=['Canva Premium','Alight Motion Premium','30 Akun','Reseller'];
const colors=['#7657d7','#d94f9d','#287f9c','#c17a35'];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spin=document.getElementById('spin'),result=document.getElementById('result'),prizeText=document.getElementById('prize');
const arc=Math.PI*2/prizes.length;
function draw(){ctx.clearRect(0,0,700,700);prizes.forEach((p,i)=>{const start=-Math.PI/2+i*arc;ctx.beginPath();ctx.moveTo(350,350);ctx.arc(350,350,330,start,start+arc);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=7;ctx.stroke();ctx.save();ctx.translate(350,350);ctx.rotate(start+arc/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.shadowColor='#0006';ctx.shadowBlur=4;ctx.fillText(p,285,12);ctx.restore();});ctx.beginPath();ctx.arc(350,350,62,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#d8c9ff';ctx.lineWidth=9;ctx.stroke();ctx.fillStyle='#35235f';ctx.font='bold 25px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('LUCKY',350,350)}
draw();let busy=false,rotation=0;
function startSpin(){if(busy)return;busy=true;spin.disabled=true;result.classList.remove('show');const winner=Math.floor(Math.random()*prizes.length);const sector=360/prizes.length;const desired=360-(winner*sector+sector/2);const current=((rotation%360)+360)%360;const extra=(desired-current+360)%360;rotation+=360*6+extra;canvas.style.transform='rotate('+rotation+'deg)';setTimeout(()=>{prizeText.textContent=prizes[winner];result.classList.add('show');spin.disabled=false;busy=false;spin.textContent='PUTAR LAGI ✦';},5100)}
spin.addEventListener('click',startSpin);document.getElementById('again').addEventListener('click',()=>{result.classList.remove('show');startSpin()});
</script></body></html>
